packages:
  - packages/@studiocms/*
  - packages/@withstudiocms/*
  - packages/@withstudiocms/*/test/fixtures/*
  - packages/*
  - playground
  - templates/*

# When resolving dependencies, prefer workspace packages over external ones
preferWorkspacePackages: true

# When installing dependencies, create symlinks for workspace packages
linkWorkspacePackages: true

# When using `pnpm publish`, do not use `workspace:` protocol in dependencies
saveWorkspaceProtocol: false

# Make sure packages are only downloaded after they have been available for a certain time
minimumReleaseAge: 4320 # 3 days

# Exclude certain packages from the minimum release age restriction
minimumReleaseAgeExclude:
  - astro
  - studiocms
  - "@studiocms/*"
  - "@withstudiocms/*"

# When running `pnpm install`, only build the following dependencies from source
onlyBuiltDependencies:
  - "@parcel/watcher"
  - canvas
  - esbuild
  - msgpackr-extract
  - sharp

# General dependency catalog for monorepo packages
catalog:
  "@types/mdast": ^4.0.4
  "@types/node": ^22.0.0
  "@types/semver": ^7.8.0
  deepmerge-ts: ^8.0.1
  esbuild: ^0.25.8
  sharp: ^0.34.3
  tinyglobby: ^0.2.17
  typescript: ^6.0.3
  diff: ^8.0.4
  dotenv: ^17.4.2
  semver: ^7.8.5
  tsdown: ^0.22.14
  package-manager-detector: ^1.8.0
  ultrahtml: ^1.7.0
  tinyexec: ^1.3.0

# Specific dependency catalogs for certain groups of packages
catalogs:
  astrojs-current:
    "@astrojs/node": ^11.1.0
    "@astrojs/rss": ^4.0.19
    astro: ^7.2.0
    vite: ^8.0.0

  astrojs-min:
    "@astrojs/internal-helpers": ^0.7.5 || ^0.8.0 || ^0.9.0 || ^0.10.0
    astro: ^5.12.9 || ^6.1.0 || ^7.0.0
    vite: ^6.3.4 || ^7.3.0 || ^8.0.0
    zod: ^4.3.6

  studiocms:
    "@studiocms/ui": ^1.2.2

  studiocms-peerlock:
    astro: ^7.0.0
    vite: ^8.0.0

  effect:
    "@effect/cli": ^0.77.0
    "@effect/platform": ^0.97.1
    "@effect/platform-node": ^0.108.1
    effect: ^3.22.1

  kysely:
    "@libsql/client": ^0.15.15
    "@types/pg": ^8.21.0
    kysely: ^0.28.17
    kysely-turso: ^0.1.1
    pg: ^8.22.0
    mysql2: ^3.23.2

  react:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    react: ^19.2.8
    react-dom: ^19.2.8
